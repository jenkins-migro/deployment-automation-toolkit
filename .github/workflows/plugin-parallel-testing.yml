name: Plugin Parallel Testing

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kind-tests:
    name: kind-${{ matrix.split_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - split_index: 0
            split_number: 1
            split_total: 2
          - split_index: 1
            split_number: 2
            split_total: 2
    steps:
      # actions/checkout v4 pinned to tag SHA 11d5960a326750d5838078e36cf38b85af677262.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v4 pinned to tag SHA cf277c60eb25467037889841efdb72551f06f6c3.
      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate split include and exclude files
        env:
          SPLIT_INDEX: ${{ matrix.split_index }}
          SPLIT_TOTAL: ${{ matrix.split_total }}
        run: |
          : > "$RUNNER_TEMP/includes.txt"
          : > "$RUNNER_TEMP/excludes.txt"
          mapfile -t tests < <(find . -type f \( -name '*Test.java' -o -name '*IT.java' \) | sort)
          for i in "${!tests[@]}"; do
            if (( i % SPLIT_TOTAL == SPLIT_INDEX )); then
              printf '%s\n' "${tests[$i]#./}" >> "$RUNNER_TEMP/includes.txt"
            else
              printf '%s\n' "${tests[$i]#./}" >> "$RUNNER_TEMP/excludes.txt"
            fi
          done

      - name: Run kind tests
        run: ./kind.sh -Penable-jacoco -Dsurefire.includesFile="$RUNNER_TEMP/includes.txt" -Dsurefire.excludesFile="$RUNNER_TEMP/excludes.txt"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-${{ matrix.split_index }}-surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore

      - name: Rename JaCoCo execution data
        if: always()
        env:
          NUM: ${{ matrix.split_index }}
        run: |
          while IFS= read -r -d '' file; do
            mv "$file" "$(dirname "$file")/$(basename "$file" | sed "s/jacoco\./jacoco-$NUM./")"
          done < <(find . -name jacoco.exec -print0)

      - name: Upload class files
        if: matrix.split_index == 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: classes
          path: '**/target/classes/**'
          if-no-files-found: ignore

      - name: Upload coverage execution data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-exec-${{ matrix.split_index }}
          path: '**/target/jacoco*.exec'
          if-no-files-found: ignore

      - name: Upload kind logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-${{ matrix.split_index }}-logs
          path: ${{ runner.temp }}/kindlogs/
          if-no-files-found: ignore

  jdk17:
    name: jdk17
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v4 pinned to tag SHA 11d5960a326750d5838078e36cf38b85af677262.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v4 pinned to tag SHA cf277c60eb25467037889841efdb72551f06f6c3.
      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with retry
        run: |
          for attempt in 1 2 3; do
            if mvn -B -ntp -Dset.changelist -Dmaven.test.failure.ignore clean install; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Prepare incrementals metadata
        run: |
          if [[ -x scripts/prepare-to-publish-incrementals.sh ]]; then
            scripts/prepare-to-publish-incrementals.sh
          else
            echo 'No incrementals preparation script found; Jenkins shared library call infra.prepareToPublishIncrementals() was not expanded further.'
          fi

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdk17-surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: ignore

  aggregate-coverage:
    name: Aggregate coverage
    runs-on: ubuntu-latest
    needs: [kind-tests, jdk17]
    steps:
      # actions/checkout v4 pinned to tag SHA 11d5960a326750d5838078e36cf38b85af677262.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java v4 pinned to tag SHA cf277c60eb25467037889841efdb72551f06f6c3.
      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # actions/download-artifact v4 pinned to tag SHA d3f86a106a0bac45b974a628896c90dbdf5c8093.
      - name: Download classes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: classes
          path: .

      - name: Download coverage execution data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: coverage-exec-*
          path: .
          merge-multiple: true

      - name: Merge JaCoCo reports
        run: mvn -B -ntp -P merge-jacoco-reports validate

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jacoco-report
          path: '**/jacoco/jacoco.xml'
          if-no-files-found: ignore

  publish-incrementals:
    name: Maybe publish incrementals
    runs-on: ubuntu-latest
    needs: [aggregate-coverage]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      # actions/checkout v4 pinned to tag SHA 11d5960a326750d5838078e36cf38b85af677262.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Maybe publish incrementals
        run: |
          if [[ -x scripts/maybe-publish-incrementals.sh ]]; then
            scripts/maybe-publish-incrementals.sh
          else
            echo 'No incrementals publishing script found; Jenkins shared library call infra.maybePublishIncrementals() was not expanded further.'
          fi
